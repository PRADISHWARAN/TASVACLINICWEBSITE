<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F4F7F5; --surface: #FFFFFF; --surface-2: #EAF0EC;
    --ink: #16211C; --ink-muted: #5B6961; --line: #DAE3DD;
    --accent: #0E7C74; --accent-ink: #FFFFFF; --accent-soft: #E1F2EF;
    --good: #2E7D4F; --good-soft: #E4F4E9; --warn: #966008; --warn-soft: #FBF0DD;
    --critical: #B23A2B; --critical-soft: #FBE6E3;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 4px 16px rgba(20, 30, 25, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1613; --surface: #172420; --surface-2: #1E2C27; --ink: #E9F2EC;
      --ink-muted: #93A69C; --line: #2B3C35; --accent: #45C3B5; --accent-ink: #06201D;
      --accent-soft: #16332E; --good: #63CC88; --good-soft: #163825; --warn: #E7AC46;
      --warn-soft: #3A2D14; --critical: #F1786C; --critical-soft: #3B1D18;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1613; --surface: #172420; --surface-2: #1E2C27; --ink: #E9F2EC;
    --ink-muted: #93A69C; --line: #2B3C35; --accent: #45C3B5; --accent-ink: #06201D;
    --accent-soft: #16332E; --good: #63CC88; --good-soft: #163825; --warn: #E7AC46;
    --warn-soft: #3A2D14; --critical: #F1786C; --critical-soft: #3B1D18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100dvh;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ---- shell / responsive nav ---- */
  .app-shell { display: flex; flex-direction: column; min-height: 100dvh; }
  .sidebar { display: none; }
  .content-col { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }

  header.topbar { position: sticky; top: 0; z-index: 10; background: var(--ground); border-bottom: 1px solid var(--line); padding: 14px 16px 12px; }
  header.topbar .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header.topbar h1 { font-size: 1.05rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header.topbar .synced { font-size: 0.7rem; color: var(--ink-muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; }
  .dot.off { background: var(--ink-muted); }
  .signout { background: transparent; border: none; color: var(--ink-muted); font-family: inherit; font-size: 0.7rem; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 4px; }

  .summary-strip { display: flex; gap: 8px; margin-top: 10px; }
  .chip { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 5px; padding: 7px 6px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; color: var(--ink-muted); background: var(--surface-2); cursor: pointer; border: none; font-family: inherit; }
  .chip .n { font-family: "IBM Plex Mono", monospace; font-size: 0.95rem; font-weight: 600; color: var(--ink); }
  .chip.warn .n { color: var(--warn); }
  .chip.critical .n { color: var(--critical); }
  .chip.active { outline: 2px solid var(--accent); outline-offset: -2px; }

  main { flex: 1; padding: 14px 16px 90px; overflow-y: auto; max-width: 680px; margin: 0 auto; width: 100%; }
  header.topbar { max-width: 680px; margin: 0 auto; width: 100%; }
  #shell.wide-view main, #shell.wide-view header.topbar { max-width: 960px; }

  nav.bottomnav { position: sticky; bottom: 0; z-index: 10; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 10px rgba(20,30,25,0.04); }
  nav.bottomnav button { flex: 1; background: transparent; border: none; font-family: inherit; font-size: 0.68rem; font-weight: 600; color: var(--ink-muted); padding: 7px 2px 5px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.bottomnav button .ic { font-size: 1.05rem; line-height: 1; }
  nav.bottomnav button.active { color: var(--accent); }

  @media (min-width: 860px) {
    .app-shell { flex-direction: row; }
    .sidebar {
      display: flex; flex-direction: column; width: 220px; flex: none;
      background: var(--surface); border-right: 1px solid var(--line); padding: 20px 12px;
      position: sticky; top: 0; height: 100dvh; align-self: flex-start;
    }
    .sidebar-brand { font-weight: 700; font-size: 1.05rem; padding: 0 10px 20px; letter-spacing: -0.01em; }
    .side-nav { display: flex; flex-direction: column; gap: 3px; }
    .side-link {
      display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: none;
      color: var(--ink-muted); font-family: inherit; font-size: 0.88rem; font-weight: 600; padding: 10px 12px;
      border-radius: 10px; cursor: pointer;
    }
    .side-link .ic { font-size: 1.05rem; }
    .side-link.active { background: var(--accent-soft); color: var(--accent); }
    nav.bottomnav { display: none; }
    main { padding-bottom: 40px; }
  }

  /* ---- shared form/list primitives ---- */
  .segmented { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 10px; }
  .segmented button { flex: 1; border: none; background: transparent; color: var(--ink-muted); font-family: inherit; font-size: 0.82rem; font-weight: 600; padding: 8px 6px; border-radius: 8px; cursor: pointer; }
  .segmented button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .filter-row select { flex: 1; min-width: 0; }

  input[type="search"], input[type="number"], input[type="text"], input[type="password"], select, textarea {
    font-family: inherit; font-size: 0.95rem; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label.field { display: block; margin-bottom: 12px; }
  label.field span.fl { display: block; font-size: 0.72rem; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 0.78rem; font-weight: 500; margin-bottom: 12px; }

  .group-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .group-title:first-child { margin-top: 0; }
  .group-title .count { font-family: "IBM Plex Mono", monospace; font-weight: 500; text-transform: none; letter-spacing: 0; }

  button.primary { width: 100%; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px; padding: 12px; font-family: inherit; font-weight: 700; font-size: 0.92rem; cursor: pointer; margin-top: 10px; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost { width: 100%; background: transparent; color: var(--ink-muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; font-family: inherit; font-size: 0.82rem; cursor: pointer; }

  .pill { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 7px; border-radius: 999px; flex: none; white-space: nowrap; }
  .pill.good { color: var(--good); background: var(--good-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.critical { color: var(--critical); background: var(--critical-soft); }
  .pill.neutral { color: var(--ink-muted); background: var(--surface-2); }
  .pill.accent { color: var(--accent); background: var(--accent-soft); }

  .action-btn, .pay-btn { margin-left: auto; background: var(--accent-soft); color: var(--accent); border: none; border-radius: 7px; padding: 5px 10px; font-family: inherit; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
  .ghost-btn { margin-left: auto; background: transparent; color: var(--ink-muted); border: 1px dashed var(--line); border-radius: 7px; padding: 5px 10px; font-family: inherit; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
  .link-btn { background: transparent; color: var(--accent); border: none; font-family: inherit; font-size: 0.72rem; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 0; }

  .empty { color: var(--ink-muted); font-size: 0.85rem; padding: 30px 0; text-align: center; }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--ground); font-size: 0.8rem; font-weight: 500; padding: 9px 16px; border-radius: 999px; box-shadow: var(--shadow); z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  /* ---- stock pane ---- */
  .proc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .proc-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; text-align: left; font-family: inherit; cursor: pointer; }
  .proc-tile .name { font-weight: 600; font-size: 0.86rem; display: block; }
  .proc-tile .runs { font-size: 0.7rem; color: var(--ink-muted); margin-top: 3px; display: block; }
  .proc-tile .runs.warn { color: var(--warn); }
  .proc-tile .runs.critical { color: var(--critical); }
  .proc-tile.selected { border-color: var(--accent); background: var(--accent-soft); }
  .bom-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 0.85rem; }
  .bom-row:last-child { border-bottom: none; }
  .bom-row .after { color: var(--ink-muted); font-size: 0.75rem; }
  .bom-row .after.warn { color: var(--warn); }
  .bom-row .after.critical { color: var(--critical); font-weight: 600; }
  .qty-actions { display: flex; gap: 8px; margin-top: 6px; }
  .qty-actions input { flex: none; width: 64px; text-align: center; }
  .qty-actions button { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; font-family: inherit; font-weight: 600; font-size: 0.82rem; padding: 10px 4px; cursor: pointer; }
  .qty-actions button.use { color: var(--critical); }
  .qty-actions button.restock { color: var(--good); }
  .cur-stock { display: flex; justify-content: space-between; align-items: baseline; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .cur-stock .val { font-family: "IBM Plex Mono", monospace; font-size: 1.3rem; font-weight: 600; }
  .item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
  .item-row .name { font-size: 0.86rem; font-weight: 500; }
  .item-row .unit { font-size: 0.7rem; color: var(--ink-muted); }
  .item-row .right { display: flex; align-items: center; gap: 8px; flex: none; }
  .item-row .qtyval { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 0.95rem; }
  .log-entry { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.8rem; }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .delta { font-family: "IBM Plex Mono", monospace; font-weight: 600; flex: none; }
  .log-entry .delta.pos { color: var(--good); }
  .log-entry .delta.neg { color: var(--critical); }
  .log-entry .ts { color: var(--ink-muted); font-size: 0.7rem; display: block; }

  /* ---- payables pane ---- */
  .po-row { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; }
  .po-row.overdue { border-left-color: var(--critical); }
  .po-row.today { border-left-color: var(--warn); }
  .po-row.week { border-left-color: var(--accent); }
  .po-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .po-supplier { font-size: 0.92rem; font-weight: 600; line-height: 1.3; }
  .po-amount { font-family: "IBM Plex Mono", monospace; font-weight: 600; font-size: 0.92rem; flex: none; white-space: nowrap; }
  .po-meta { font-size: 0.74rem; color: var(--ink-muted); margin-top: 3px; }
  .po-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
  .status-tag { font-size: 0.68rem; font-weight: 600; color: var(--ink-muted); background: var(--surface-2); padding: 2px 7px; border-radius: 6px; text-transform: capitalize; }
  .reminder-note { font-size: 0.68rem; color: var(--ink-muted); }

  /* ---- appointments / patients / conversations panes ---- */
  .row-card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 12px; padding: 12px 13px; margin-bottom: 8px; }
  .row-card.today { border-left-color: var(--warn); }
  .row-card.pastdue { border-left-color: var(--critical); }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .row-name { font-size: 0.92rem; font-weight: 600; line-height: 1.3; }
  .row-meta { font-size: 0.76rem; color: var(--ink-muted); margin-top: 3px; line-height: 1.5; }
  .row-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; gap: 8px; flex-wrap: wrap; }

  details.more { margin-top: 8px; }
  details.more summary { font-size: 0.76rem; font-weight: 600; color: var(--accent); cursor: pointer; list-style: none; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more .body { font-size: 0.8rem; color: var(--ink); margin-top: 8px; line-height: 1.7; }
  details.more .body b { font-weight: 600; color: var(--ink-muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
  details.transcript { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; margin-top: 8px; }
  details.transcript summary { font-size: 0.76rem; font-weight: 600; cursor: pointer; }
  details.transcript .body { font-size: 0.76rem; color: var(--ink-muted); white-space: pre-wrap; margin-top: 7px; line-height: 1.5; max-height: 200px; overflow-y: auto; }

  .convo-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer; }
  .convo-row .name { font-weight: 600; font-size: 0.9rem; }
  .convo-row .meta { font-size: 0.75rem; color: var(--ink-muted); margin-top: 2px; }
  .convo-row .right { flex: none; text-align: right; }

  .thread-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .back-btn { background: transparent; border: none; color: var(--accent); font-family: inherit; font-weight: 600; font-size: 0.85rem; cursor: pointer; padding: 4px 0; }
  .thread-name { font-weight: 700; font-size: 1rem; flex: 1; }
  .thread-msgs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .msg-bubble { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; line-height: 1.4; }
  .msg-bubble.user { align-self: flex-start; background: var(--surface-2); color: var(--ink); border-bottom-left-radius: 3px; }
  .msg-bubble.assistant { align-self: flex-end; background: var(--accent-soft); color: var(--ink); border-bottom-right-radius: 3px; }
  .msg-bubble.staff { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
  .msg-ts { font-size: 0.65rem; color: var(--ink-muted); margin-top: 3px; }
  .send-row { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--ground); padding: 8px 0 4px; }
  .send-row textarea { flex: 1; resize: none; min-height: 40px; max-height: 100px; }
  .send-row button { flex: none; width: auto; padding: 0 16px; margin-top: 0; }

  /* ---- calendar ---- */
  .cal-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .cal-nav-btn { background: var(--surface-2); border: none; border-radius: 8px; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; color: var(--ink); flex: none; }
  .cal-title { font-weight: 700; font-size: 0.98rem; flex: 1; text-align: center; }
  .cal-today-btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-size: 0.76rem; font-weight: 600; cursor: pointer; color: var(--ink-muted); flex: none; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .cal-dow { text-align: center; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--ink-muted); padding-bottom: 6px; }
  .cal-cell {
    aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; font-size: 0.8rem; font-family: inherit; color: var(--ink); padding: 0;
  }
  .cal-cell.outside { visibility: hidden; cursor: default; }
  .cal-cell.today { border-color: var(--accent); border-width: 2px; }
  .cal-cell.selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cal-cell .daynum { font-weight: 600; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .cal-dot.warn { background: var(--warn); }
  .cal-dot.critical { background: var(--critical); }
  .cal-dot.good { background: var(--good); }
  .cal-cell.selected .cal-dot { background: var(--accent-ink); }
  @media (min-width: 560px) { .cal-cell { font-size: 0.9rem; } .cal-dot { width: 6px; height: 6px; } }

  /* ---- login ---- */
  #login-screen { max-width: 340px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px; }
  #login-screen h1 { font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; }
  #login-screen p.sub { color: var(--ink-muted); font-size: 0.82rem; margin: 0 0 20px; }
  #login-error { display: none; background: var(--critical-soft); color: var(--critical); font-size: 0.8rem; padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }
  #login-error.show { display: block; }
</style>
</head>
<body>

<div id="login-screen" style="display:none">
  <h1>Front Desk</h1>
  <p class="sub">Enter the staff password to continue.</p>
  <div id="login-error"></div>
  <form id="login-form">
    <label class="field"><span class="fl">Password</span><input type="password" id="login-password" autocomplete="current-password" required></label>
    <button type="submit" class="primary" id="login-submit">Continue</button>
  </form>
</div>

<div id="shell" class="app-shell" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-brand">Front Desk</div>
    <nav class="side-nav">
      <button class="side-link" data-pane="appointments"><span class="ic">📅</span>Appointments</button>
      <button class="side-link" data-pane="patients"><span class="ic">🧾</span>New Patients</button>
      <button class="side-link" data-pane="conversations"><span class="ic">💬</span>Conversations</button>
      <button class="side-link" data-pane="stock"><span class="ic">📦</span>Stock</button>
      <button class="side-link" data-pane="payables"><span class="ic">💳</span>Payables</button>
    </nav>
  </aside>

  <div class="content-col">
    <header class="topbar">
      <div class="row1">
        <h1 id="pane-title">Appointments</h1>
        <span class="synced" id="synced-indicator"><span class="dot off" id="sync-dot"></span><span id="sync-text">Connecting&hellip;</span></span>
      </div>
      <div class="summary-strip" id="summary-strip"></div>
      <button class="signout" id="signout-btn">Sign out</button>
    </header>

    <main id="view"><div class="empty">Loading&hellip;</div></main>

    <nav class="bottomnav">
      <button data-pane="appointments"><span class="ic">📅</span>Appts</button>
      <button data-pane="patients"><span class="ic">🧾</span>Patients</button>
      <button data-pane="conversations"><span class="ic">💬</span>Chats</button>
      <button data-pane="stock"><span class="ic">📦</span>Stock</button>
      <button data-pane="payables"><span class="ic">💳</span>Pay</button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {

  // ==================== shared helpers ====================

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  function fmtDate(d) {
    if (!d) return "—";
    var dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  }
  function fmtDateTime(iso) {
    if (!iso) return "—";
    try { return new Date(iso).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
    catch (e) { return ""; }
  }
  function fmtRelativeTime(iso) {
    try {
      var d = new Date(iso); var now = new Date();
      var sameDay = d.toDateString() === now.toDateString();
      var time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      if (sameDay) return time;
      return d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + time;
    } catch (e) { return ""; }
  }
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var d = new Date(dateStr + "T00:00:00");
    return Math.round((d - today) / 86400000);
  }
  function showToast(msg) {

  function stockItemById(id) { for (var i = 0; i < stockState.items.length; i++) if (stockState.items[i].id === id) return stockState.items[i]; return null; }
  function stockProcById(id) { for (var i = 0; i < stockState.procedures.length; i++) if (stockState.procedures[i].id === id) return stockState.procedures[i]; return null; }
  function stockStatusOf(item) { if (item.qty <= 0) return "critical"; if (item.qty <= item.low) return "warn"; return "good"; }
  function stockStatusLabel(s) { return s === "critical" ? "Out" : s === "warn" ? "Low" : "Good"; }
  function stockRunsRemaining(proc) {
    var min = Infinity;
    for (var i = 0; i < proc.consumables.length; i++) {
      var c = proc.consumables[i]; var it = stockItemById(c.itemId);
      if (!it || c.qty <= 0) continue;
      min = Math.min(min, Math.floor(it.qty / c.qty));
    }
    return min === Infinity ? 0 : min;
  }

  async function loadStockData() {
    var itemsRes = await supabaseClient.from("stock_items").select("id,name,unit,category,qty,low_threshold").order("name");
    var procsRes = await supabaseClient.from("stock_procedures").select("id,name,stock_procedure_consumables(item_id,qty)").order("name");
    var logRes = await supabaseClient.from("stock_log").select("id,ts,kind,label,delta").order("ts", { ascending: false }).limit(15);
    if (itemsRes.error || procsRes.error || logRes.error) { console.error(itemsRes.error, procsRes.error, logRes.error); return; }
    stockState.items = itemsRes.data.map(function (r) { return { id: r.id, name: r.name, unit: r.unit, category: r.category, qty: r.qty, low: r.low_threshold }; });
    stockState.procedures = procsRes.data.map(function (r) {
      return { id: r.id, name: r.name, consumables: (r.stock_procedure_consumables || []).map(function (c) { return { itemId: c.item_id, qty: c.qty }; }) };
    });
    stockState.log = logRes.data.map(function (r) { return { id: r.id, ts: r.ts, kind: r.kind, label: r.label, delta: r.delta }; });
  }

  async function stockUpdateQty(itemId, newQty) {
    var it = stockItemById(itemId);
    if (it) it.qty = newQty;
    var res = await supabaseClient.from("stock_items").update({ qty: newQty }).eq("id", itemId);
    if (res.error) { console.error(res.error); showToast("Failed to save — check connection"); }
  }
  async function stockInsertLog(entry) {
    var res = await supabaseClient.from("stock_log").insert({
      kind: entry.kind, label: entry.label, item_id: entry.itemId || null, procedure_id: entry.procedureId || null, delta: entry.delta === undefined ? null : entry.delta,
    }).select().single();
    if (res.error) { console.error(res.error); return; }
    stockState.log.unshift({ id: res.data.id, ts: res.data.ts, kind: res.data.kind, label: res.data.label, delta: res.data.delta });
    if (stockState.log.length > 15) stockState.log.length = 15;
  }
  async function stockInsertItem(item) {
    var res = await supabaseClient.from("stock_items").insert({ id: item.id, name: item.name, unit: item.unit, category: item.category, qty: item.qty, low_threshold: item.low });
    if (res.error) { console.error(res.error); showToast("Failed to add item — check connection"); return false; }
    stockState.items.push(item);
    return true;
  }

          showToast("Saved"); renderStockPane();

  var payablesOrders = [];
  var payablesUrgencyFilter = "all";
  var payablesTypeFilter = "";
  var payablesStatusFilter = "";
  var payablesSearch = "";

  function fmtMoney(n) {
    var v = Number(n) || 0;
    return "₹" + v.toLocaleString("en-IN", { maximumFractionDigits: 0 });
  }
  function payablesUrgencyOf(o) {
    if (o.paid_at) return "paid";
    var d = daysUntil(o.due_date);
    if (d === null) return "none";
    if (d < 0) return "overdue";
    if (d === 0) return "today";
    if (d <= 7) return "week";
    if (d <= 30) return "month";
    return "later";
  }
  function payablesDueLabel(o) {
    var d = daysUntil(o.due_date);
    if (d === null) return "No due date";
    if (d < 0) return "Overdue by " + (-d) + " day" + (-d === 1 ? "" : "s");
    if (d === 0) return "Due today";
    if (d === 1) return "Due tomorrow";
    return "Due in " + d + " days";
  }

  async function loadPayablesData() {
    var res = await supabaseClient
      .from("purchase_orders")
      .select("id,ref_no,document_number,grn_number,document_date,entry_date,supplier_name,purchase_amount,purchase_type,entered_by,medicine_status,due_date,reminder_3day_sent_at,reminder_dueday_sent_at,paid_at")
      .order("due_date", { ascending: true, nullsFirst: false });
    if (res.error) { console.error(res.error); return; }
    payablesOrders = res.data || [];
  }

  async function payablesSetPaid(id, paid) {
    var o = payablesOrders.find(function (x) { return x.id === id; });
    var prev = o ? o.paid_at : null;
    if (o) o.paid_at = paid ? new Date().toISOString() : null;
    renderPayablesPane();
    var res = await supabaseClient.from("purchase_orders").update({ paid_at: paid ? new Date().toISOString() : null }).eq("id", id);
    if (res.error) { console.error(res.error); if (o) o.paid_at = prev; renderPayablesPane(); }
  }

  function renderPayablesSummary() {
    var overdue = 0, today = 0, week = 0;
    payablesOrders.forEach(function (o) {
      var u = payablesUrgencyOf(o);
      if (u === "overdue") overdue++; else if (u === "today") today++; else if (u === "week") week++;
    });
    document.getElementById("summary-strip").innerHTML =
      '<button class="chip critical' + (payablesUrgencyFilter === "overdue" ? " active" : "") + '" data-pay-urgency="overdue"><span class="n">' + overdue + '</span><span>overdue</span></button>' +
      '<button class="chip warn' + (payablesUrgencyFilter === "today" ? " active" : "") + '" data-pay-urgency="today"><span class="n">' + today + '</span><span>today</span></button>' +
      '<button class="chip' + (payablesUrgencyFilter === "week" ? " active" : "") + '" data-pay-urgency="week"><span class="n">' + week + '</span><span>this week</span></button>';
  }

  function payablesDistinctValues(key) {
    var set = {};
    payablesOrders.forEach(function (o) { if (o[key]) set[o[key]] = true; });
    return Object.keys(set).sort();
  }

  function poRowHtml(o) {
    var u = payablesUrgencyOf(o);
    var pillCls = u === "paid" ? "good" : u === "overdue" ? "critical" : u === "today" ? "warn" : u === "week" ? "good" : "neutral";
    var rowCls = u === "overdue" ? "overdue" : u === "today" ? "today" : u === "week" ? "week" : "";
    var pillLabel = u === "paid" ? "Paid " + fmtDate(o.paid_at.slice(0, 10)) : payablesDueLabel(o);
    var reminders = [];
    if (o.reminder_3day_sent_at) reminders.push("3-day reminder sent");
    if (o.reminder_dueday_sent_at) reminders.push("due-day reminder sent");
    var actionHtml = u === "paid"
      ? '<button class="ghost-btn" data-unpaid="' + o.id + '">Undo</button>'
      : '<button class="pay-btn" data-paid="' + o.id + '">Mark paid</button>';

    return '<div class="po-row ' + rowCls + '">' +

  var apptTypeFilter = "";
  var apptSearch = "";
  var apptViewMode = "list"; // list | calendar
  var calendarMonth = new Date(); calendarMonth.setDate(1); calendarMonth.setHours(0, 0, 0, 0);
  var calendarSelectedDate = toDateStr(new Date());

  var patientFilter = "pending";
  var patientSearch = "";

  var conversationSearch = "";
  var selectedConversationId = null;
  var threadMessages = [];

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function toDateStr(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function fmtMonthYear(d) { return d.toLocaleDateString("en-IN", { month: "long", year: "numeric" }); }
  function apptTimeSortKey(o) {
    var m = (o.preferred_time || "").match(/^(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!m) return 0;
    var h = parseInt(m[1], 10); var min = parseInt(m[2], 10); var ap = m[3].toUpperCase();
    if (ap === "PM" && h !== 12) h += 12;
    if (ap === "AM" && h === 12) h = 0;
    return h * 60 + min;
  }
  function apptsOnDate(dateStr) {
    return appts.filter(function (o) { return o.preferred_date === dateStr; }).sort(function (a, b) { return apptTimeSortKey(a) - apptTimeSortKey(b); });
  }

  async function loadFrontDeskData() {
    var apptRes = await apiGet("appointment_submissions?select=*&order=preferred_date.asc");
    var patientRes = await apiGet("patient_intake_queue?select=*&order=created_at.desc");
    var convoRes = await apiGet("conversations?select=*&order=updated_at.desc&limit=200");
    appts = apptRes || [];
    patients = patientRes || [];
    conversations = convoRes || [];
  }
  async function loadThread(conversationId) {
    var res = await apiGet("messages?conversation_id=eq." + encodeURIComponent(conversationId) + "&select=role,content,created_at,seen_at&order=created_at.asc&limit=100");
    threadMessages = res || [];
  }
  async function resumeBot(conversationId) {
    var c = conversations.find(function (x) { return x.id === conversationId; });
    if (c) c.bot_paused_until = null;
    render();
    await apiPatch("conversations", conversationId, { bot_paused_until: null });
  }
  async function sendStaffMessage(phone, text) {
    var res = await fetch(STAFF_SEND_URL + "?token=" + encodeURIComponent(STAFF_SEND_TOKEN), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ phone: phone, text: text }),
    });
    return res.ok;
  }
  async function markAppt(id, handled) {
    var o = appts.find(function (x) { return x.id === id; });
    var prev = o ? o.handled_at : null;
    if (o) o.handled_at = handled ? new Date().toISOString() : null;
    render();
    var ok = await apiPatch("appointment_submissions", id, { handled_at: handled ? new Date().toISOString() : null });
    if (!ok && o) { o.handled_at = prev; render(); }
  }
  async function markPatient(id, entered) {
    var p = patients.find(function (x) { return x.id === id; });
    var prev = p ? p.entered_crm_at : null;
    if (p) p.entered_crm_at = entered ? new Date().toISOString() : null;
    render();
    var ok = await apiPatch("patient_intake_queue", id, { entered_crm_at: entered ? new Date().toISOString() : null });
    if (!ok && p) { p.entered_crm_at = prev; render(); }
  }

  function apptBucket(o) {
    if (o.handled_at) return "handled";
    var d = daysUntil(o.preferred_date);
    if (d === null) return "later";
    if (d < 0) return "pastdue";
    if (d === 0) return "today";
    if (d === 1) return "tomorrow";
    if (d <= 7) return "week";
    return "later";
  }

  function renderApptSummary() {
    var pending = 0, today = 0, pastdue = 0;
    appts.forEach(function (o) {
      var b = apptBucket(o);
      if (b !== "handled") pending++;
      if (b === "today") today++;
      if (b === "pastdue") pastdue++;
    });
    document.getElementById("summary-strip").innerHTML =
      '<div class="chip"><span class="n">' + pending + '</span><span>pending</span></div>' +
      '<div class="chip warn"><span class="n">' + today + '</span><span>today</span></div>' +
      '<div class="chip critical"><span class="n">' + pastdue + '</span><span>past due</span></div>';
  }

  function apptRowHtml(o) {
    var bucket = apptBucket(o);
    var rowCls = bucket === "today" ? "today" : bucket === "pastdue" ? "pastdue" : "";
    var typePill = o.patient_type === "new" ? '<span class="pill accent">New</span>' : '<span class="pill neutral">Existing</span>';
    var statusPill = o.handled_at
      ? '<span class="pill good">Booked ' + fmtDateTime(o.handled_at) + '</span>'
      : (bucket === "pastdue" ? '<span class="pill critical">Past due</span>' : bucket === "today" ? '<span class="pill warn">Today</span>' : '');
    var actionHtml = o.handled_at
      ? '<button class="ghost-btn" data-unhandle-appt="' + o.id + '">Undo</button>'

    return '<div class="row-card ' + rowCls + '">' +
      '<div class="row-top"><div><div class="row-name">' + escapeHtml(o.patient_name) + ' ' + typePill + '</div>' +
      '<div class="row-meta">' + escapeHtml(o.mobile_number) + ' · ' + fmtDate(o.preferred_date) + ', ' + escapeHtml(o.preferred_time) + '</div></div></div>' +
      (o.reason_for_visit ? '<div class="row-meta" style="margin-top:6px">' + escapeHtml(o.reason_for_visit) + '</div>' : '') +
      '<div class="row-bottom">' + statusPill + linkTag + actionHtml + '</div>' +
      (o.chat_transcript ? '<details class="transcript"><summary>WhatsApp transcript</summary><div class="body">' + escapeHtml(o.chat_transcript) + '</div></details>' : '') +
    '</div>';

  function renderApptListBody() {
    var q = apptSearch.trim().toLowerCase();
    var filtered = appts.filter(function (o) {
      var bucket = apptBucket(o);
      if (apptFilter === "pending" && bucket === "handled") return false;
      if (apptFilter === "handled" && bucket !== "handled") return false;
      if (apptTypeFilter && o.patient_type !== apptTypeFilter) return false;
      if (q) {
        var hay = ((o.patient_name || "") + " " + (o.mobile_number || "") + " " + (o.intake_ref || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    var buckets = { pastdue: [], today: [], tomorrow: [], week: [], later: [], handled: [] };
    filtered.forEach(function (o) { buckets[apptBucket(o)].push(o); });
    var labels = { pastdue: "Past due", today: "Today", tomorrow: "Tomorrow", week: "This week", later: "Later", handled: "Booked" };

    var html = '<label class="field"><input type="search" id="appt-search" placeholder="Search name or mobile…" value="' + escapeHtml(apptSearch) + '"></label>';
    html += '<div class="segmented">';
    [["pending", "Pending"], ["all", "All"], ["handled", "Booked"]].forEach(function (p) {

    });
    html += '</div><div class="filter-row"><select id="appt-type-filter"><option value="">All patient types</option>' +
      '<option value="new" ' + (apptTypeFilter === "new" ? "selected" : "") + '>New patients</option>' +
      '<option value="existing" ' + (apptTypeFilter === "existing" ? "selected" : "") + '>Existing patients</option></select></div>';

    var any = false;
    ["pastdue", "today", "tomorrow", "week", "later", "handled"].forEach(function (key) {
      if (buckets[key].length === 0) return;
      any = true;
      html += '<div class="group-title">' + labels[key] + '<span class="count">' + buckets[key].length + '</span></div>';
      buckets[key].forEach(function (o) { html += apptRowHtml(o); });

  function renderCalendarBody() {
    var year = calendarMonth.getFullYear(), month = calendarMonth.getMonth();
    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var todayStr = toDateStr(new Date());

    var html = '<div class="cal-header">' +
      '<button class="cal-nav-btn" id="cal-prev">&larr;</button>' +
      '<span class="cal-title">' + fmtMonthYear(calendarMonth) + '</span>' +
      '<button class="cal-today-btn" id="cal-today">Today</button>' +
      '<button class="cal-nav-btn" id="cal-next">&rarr;</button></div>';

    html += '<div class="cal-grid">';
    ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(function (d) { html += '<div class="cal-dow">' + d + '</div>'; });
    for (var i = 0; i < firstDow; i++) html += '<div class="cal-cell outside"></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var dStr = year + "-" + pad2(month + 1) + "-" + pad2(day);
      var dayAppts = apptsOnDate(dStr);
      var cls = "cal-cell";
      if (dStr === todayStr) cls += " today";
      if (dStr === calendarSelectedDate) cls += " selected";
      var anyPending = dayAppts.some(function (o) { return !o.handled_at; });
      var dotCls = anyPending ? (dStr <= todayStr ? "critical" : "warn") : "good";
      html += '<button class="' + cls + '" data-cal-day="' + dStr + '"><span class="daynum">' + day + '</span>' +
        (dayAppts.length ? '<span class="cal-dot ' + dotCls + '"></span>' : '') + '</button>';
    }
    html += '</div>';

    var dayList = apptsOnDate(calendarSelectedDate);
    html += '<div class="group-title">' + fmtDate(calendarSelectedDate) + '<span class="count">' + dayList.length + '</span></div>';
    if (dayList.length === 0) html += '<div class="empty">No appointment requests for this day</div>';
    else dayList.forEach(function (o) { html += apptRowHtml(o); });
    return html;
  }

  function patientRowHtml(p) {

      if (!q) return true;
      var hay = ((c.patient_name || "") + " " + (c.phone_number || "")).toLowerCase();
      return hay.indexOf(q) !== -1;
    });

    var html = '<label class="field"><input type="search" id="convo-search" placeholder="Search name or phone…" value="' + escapeHtml(conversationSearch) + '"></label>';
    if (filtered.length === 0) {
      html += '<div class="empty">No conversations match your search</div>';
    } else {
      filtered.forEach(function (c) {
        var paused = isPaused(c);
        html += '<div class="convo-row" data-open-convo="' + c.id + '"><div><div class="name">' + escapeHtml(c.patient_name || c.phone_number) + '</div>' +
          '<div class="meta">' + escapeHtml(c.phone_number) + ' · updated ' + fmtDateTime(c.updated_at) + '</div></div>' +
          '<div class="right">' + (paused ? '<span class="pill warn">Bot paused</span>' : '<span class="pill good">Bot active</span>') + '</div></div>';
      });
    }
    view.innerHTML = html;

    var s = document.getElementById("convo-search");
    if (s) s.addEventListener("input", function () {
      conversationSearch = s.value; var pos = s.selectionStart; renderConversationsList();
      var el2 = document.getElementById("convo-search"); el2.focus(); el2.setSelectionRange(pos, pos);
    });
    document.querySelectorAll("[data-open-convo]").forEach(function (row) {
      row.addEventListener("click", function () { selectedConversationId = row.getAttribute("data-open-convo"); loadThread(selectedConversationId).then(renderConversationsPane); });
    });
  }

  function renderConversationThread() {
    var c = conversations.find(function (x) { return x.id === selectedConversationId; });
    if (!c) { selectedConversationId = null; renderConversationsList(); return; }
    var paused = isPaused(c);

    var html = '<div class="thread-header"><button class="back-btn" id="convo-back">&larr; Back</button>' +
      '<span class="thread-name">' + escapeHtml(c.patient_name || c.phone_number) + '</span>' +
      (paused ? '<span class="pill warn">Paused until ' + fmtDateTime(c.bot_paused_until) + '</span>' : '<span class="pill good">Bot active</span>') + '</div>';
    if (paused) html += '<button class="ghost-btn" id="resume-bot-btn" style="margin-bottom:12px">Resume bot now</button>';

    html += '<div class="thread-msgs">';
    if (threadMessages.length === 0) {
      html += '<div class="empty">No messages yet</div>';
    } else {
      threadMessages.forEach(function (m) {
        var isStaff = m.role === "assistant" && m.content.indexOf("[Staff]") === 0;
        var cls = isStaff ? "staff" : m.role;
        var text = isStaff ? m.content.replace(/^\[Staff\]\s*/, "") : m.content;
        var seenLine = m.role === "assistant" ? (m.seen_at ? " · Seen " + fmtDateTime(m.seen_at) : " · Sent") : "";
        html += '<div class="msg-bubble ' + cls + '">' + escapeHtml(text) + '<div class="msg-ts">' + fmtDateTime(m.created_at) + escapeHtml(seenLine) + '</div></div>';
      });
    }
    html += '</div><div class="send-row"><textarea id="staff-reply-text" placeholder="Reply as the clinic — sending pauses the bot on this conversation for 24h"></textarea>' +
      '<button class="primary" id="staff-send-btn">Send</button></div>';

    view.innerHTML = html;
    document.getElementById("convo-back").addEventListener("click", function () { selectedConversationId = null; renderConversationsList(); });
    var resumeBtn = document.getElementById("resume-bot-btn");
    if (resumeBtn) resumeBtn.addEventListener("click", function () { resumeBot(c.id); });
    document.getElementById("staff-send-btn").addEventListener("click", async function () {
      var textEl = document.getElementById("staff-reply-text");
      var text = textEl.value.trim();
      if (!text) return;
      var btn = this; btn.disabled = true;
      var ok = await sendStaffMessage(c.phone_number, text);
      btn.disabled = false;
      if (!ok) { alert("Failed to send — check connection and try again."); return; }
      c.bot_paused_until = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
      await loadThread(c.id);
      renderConversationThread();
    });
  }

  function renderConversationsPane() {
    if (selectedConversationId) renderConversationThread(); else renderConversationsList();
  }

  // ==================== top-level ====================

  function render() {
    document.getElementById("pane-title").textContent = PANE_TITLES[activePane];
    if (activePane !== "appointments") document.getElementById("shell").classList.remove("wide-view");

    if (activePane === "appointments") renderAppointmentsPane();
    else if (activePane === "patients") renderPatientsPane();
    else if (activePane === "conversations") renderConversationsPane();
    else if (activePane === "stock") renderStockPane();
    else renderPayablesPane();

    document.querySelectorAll("[data-pane]").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-pane") === activePane);
    });
  }

  document.querySelectorAll("[data-pane]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      activePane = btn.getAttribute("data-pane");
      if (activePane === "conversations") selectedConversationId = null;
      render();
    });
  });

  async function loadAllData() {
    await Promise.all([loadStockData(), loadPayablesData(), loadFrontDeskData()]);
  }

  function setupRealtime() {
    function refreshUnlessComposing() {
      if (activePane === "conversations" && selectedConversationId) return;
      loadAllData().then(render);
    }
    supabaseClient.channel("hub-sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "stock_items" }, refreshUnlessComposing)
      .on("postgres_changes", { event: "*", schema: "public", table: "stock_log" }, refreshUnlessComposing)
      .on("postgres_changes", { event: "*", schema: "public", table: "purchase_orders" }, refreshUnlessComposing)
      .on("postgres_changes", { event: "*", schema: "public", table: "appointment_submissions" }, refreshUnlessComposing)
      .on("postgres_changes", { event: "*", schema: "public", table: "patient_intake_queue" }, refreshUnlessComposing)
      .on("postgres_changes", { event: "*", schema: "public", table: "conversations" }, refreshUnlessComposing)
      .subscribe(function (status) {
        var dot = document.getElementById("sync-dot"); var text = document.getElementById("sync-text");
        if (status === "SUBSCRIBED") { dot.classList.remove("off"); text.textContent = "Live"; }
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") { dot.classList.add("off"); text.textContent = "Offline"; }
      });
  }

  // ==================== auth gate ====================

  var SITE_PASSWORD = "hello@tasvaa";
  var AUTH_STORAGE_KEY = "supplyRoomAuthed";
  var loginScreen = document.getElementById("login-screen");
  var shell = document.getElementById("shell");
  var realtimeStarted = false;

  function showApp() {
    loginScreen.style.display = "none";
    shell.style.display = "flex";
    loadAllData().then(function () {
      render();
      if (!realtimeStarted) { setupRealtime(); realtimeStarted = true; }
    });
  }
  function showLogin(message) {
    shell.style.display = "none";
    loginScreen.style.display = "flex";
    var err = document.getElementById("login-error");
    if (message) { err.textContent = message; err.classList.add("show"); } else { err.classList.remove("show"); }
  }

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var password = document.getElementById("login-password").value;
    if (password !== SITE_PASSWORD) { showLogin("Wrong password"); return; }
    try { localStorage.setItem(AUTH_STORAGE_KEY, "1"); } catch (err) {}
    showApp();
  });
  document.getElementById("signout-btn").addEventListener("click", function () {
    try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (err) {}
    showLogin();
  });

  var alreadyAuthed = false;
  try { alreadyAuthed = localStorage.getItem(AUTH_STORAGE_KEY) === "1"; } catch (err) {}
  if (alreadyAuthed) showApp(); else showLogin();
})();
</script>
</body>
</html>
