<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F4F7F5; --surface: #080707; --surface-2: #EAF0EC;
    --ink: #16211C; --ink-muted: #5B6961; --line: #DAE3DD;
    --accent: #0E7C74; --accent-ink: #FFFFFF; --accent-soft: #E1F2EF;
    --good: #2E7D4F; --good-soft: #E4F4E9; --warn: #966008; --warn-soft: #FBF0DD;
    --critical: #B23A2B; --critical-soft: #FBE6E3;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 4px 16px rgba(20, 30, 25, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1613; --surface: #172420; --surface-2: #1E2C27; --ink: #E9F2EC;
      --ink-muted: #93A69C; --line: #2B3C35; --accent: #45C3B5; --accent-ink: #06201D;
      --accent-soft: #16332E; --good: #63CC88; --good-soft: #163825; --warn: #E7AC46;
      --warn-soft: #3A2D14; --critical: #F1786C; --critical-soft: #3B1D18;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1613; --surface: #172420; --surface-2: #1E2C27; --ink: #E9F2EC;
    --ink-muted: #93A69C; --line: #2B3C35; --accent: #45C3B5; --accent-ink: #06201D;
    --accent-soft: #16332E; --good: #63CC88; --good-soft: #163825; --warn: #E7AC46;
    --warn-soft: #3A2D14; --critical: #F1786C; --critical-soft: #3B1D18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100dvh;
  }

  #shell { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; background: var(--ground); }

  header.topbar { position: sticky; top: 0; z-index: 10; background: var(--ground); border-bottom: 1px solid var(--line); padding: 14px 16px 12px; }
  header.topbar .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header.topbar h1 { font-size: 1.05rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header.topbar p.sub { font-size: 0.76rem; color: var(--ink-muted); margin: 3px 0 0; }
  .header-actions { display: flex; gap: 6px; flex: none; }
  .icon-btn { background: transparent; border: 1px solid var(--line); color: var(--ink-muted); font-family: inherit; font-size: 0.72rem; font-weight: 600; padding: 6px 10px; border-radius: 8px; cursor: pointer; }

  main { flex: 1; padding: 14px 16px 8px; overflow-y: auto; display: flex; flex-direction: column; }
  .empty-hint { color: var(--ink-muted); font-size: 0.85rem; padding: 40px 20px; text-align: center; line-height: 1.6; }

  .thread-msgs { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
  .msg-bubble { max-width: 82%; padding: 9px 13px; border-radius: 14px; font-size: 0.88rem; line-height: 1.45; white-space: pre-wrap; }
  .msg-bubble.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg-bubble.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-bottom-left-radius: 4px; }
  .msg-bubble.typing { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .msg-bubble.typing .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-muted); opacity: 0.5; animation: blink 1.2s infinite; }
  .msg-bubble.typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .msg-bubble.typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .msg-bubble.typing .dot { animation: none; } }

  .annotation { align-self: center; max-width: 92%; font-size: 0.72rem; font-weight: 600; color: var(--ink-muted); background: var(--surface-2); border-radius: 999px; padding: 5px 12px; text-align: center; }
  .annotation.tool { color: var(--accent); background: var(--accent-soft); }
  .annotation.escalated { color: var(--critical); background: var(--critical-soft); }

  .paused-banner { background: var(--critical-soft); color: var(--critical); border-radius: 10px; padding: 10px 12px; font-size: 0.8rem; font-weight: 500; margin: 10px 0 0; text-align: center; }

  .composer { position: sticky; bottom: 0; background: var(--ground); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .send-row { display: flex; gap: 8px; }
  .send-row textarea {
    flex: 1; resize: none; min-height: 42px; max-height: 120px; font-family: inherit; font-size: 0.9rem;
    color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px;
  }
  .send-row textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .send-row button { flex: none; width: 60px; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 12px; font-family: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  .send-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .quick-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .quick-chip { background: var(--surface-2); border: none; color: var(--ink-muted); font-family: inherit; font-size: 0.72rem; font-weight: 600; padding: 6px 10px; border-radius: 999px; cursor: pointer; }

  #login-screen { max-width: 340px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px; }
  #login-screen h1 { font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; }
  #login-screen p.sub { color: var(--ink-muted); font-size: 0.82rem; margin: 0 0 20px; }
  #login-error { display: none; background: var(--critical-soft); color: var(--critical); font-size: 0.8rem; padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }
  #login-error.show { display: block; }
  label.field { display: block; margin-bottom: 12px; }
  label.field span.fl { display: block; font-size: 0.72rem; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; }
  input[type="password"] {
    font-family: inherit; font-size: 0.95rem; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
  }
  button.primary { width: 100%; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 10px; padding: 12px; font-family: inherit; font-weight: 700; font-size: 0.92rem; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<div id="login-screen" style="display:none">
  <h1>Bot Tester</h1>
  <p class="sub">Enter the staff password to continue.</p>
  <div id="login-error"></div>
  <form id="login-form">
    <label class="field"><span class="fl">Password</span><input type="password" id="login-password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Continue</button>
  </form>
</div>

<div id="shell" style="display:none">
  <header class="topbar">
    <div class="row1">
      <div>
        <h1>Bot Tester</h1>
        <p class="sub">Talk to the live Tasvaa Clinic bot — nothing here reaches WhatsApp or real patients.</p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="reset-btn">New chat</button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="thread-msgs" id="thread"></div>
  </main>

  <div class="composer">
    <div class="quick-row" id="quick-row">
      <button class="quick-chip" data-msg="Hi, how much for laser hair reduction?">💬 Pricing question</button>
      <button class="quick-chip" data-msg="I'd like to book an appointment">📅 Book appointment</button>
      <button class="quick-chip" data-msg="hi">👋 Vague opener ("hi")</button>
      <button class="quick-chip" data-msg="Is this Dr. Sharma's personal number? I need to ask her something unrelated to the clinic">❓ Off-topic message</button>
    </div>
    <div class="send-row">
      <textarea id="composer-input" placeholder="Type a message as a patient would…" rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var BOT_TEST_URL = "https://vppwvpplehaxiqzoibkj.functions.supabase.co/bot-test";
  var BOT_TEST_TOKEN = "639cb893e4edde6f85be1480d846c72e50f9fcf8bcbb30cd";
  var SITE_PASSWORD = "hello@tasvaa";
  var AUTH_STORAGE_KEY = "botTesterAuthed";

  var messages = []; // {role: "user"|"assistant", content: string}
  var paused = false;
  var sending = false;

  var thread = document.getElementById("thread");
  var main = document.getElementById("main");
  var input = document.getElementById("composer-input");
  var sendBtn = document.getElementById("send-btn");
  var quickRow = document.getElementById("quick-row");

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }

  function scrollToBottom() { main.scrollTop = main.scrollHeight; }

  function render() {
    var html = "";
    if (messages.length === 0) {
      html += '<div class="empty-hint">Send a message below as if you were a patient messaging on WhatsApp. Try the quick prompts to test the "is this really Tasvaa Clinic" screening and the escalation flow.</div>';
    }
    messages.forEach(function (m) {
      if (m.kind === "annotation") {
        html += '<div class="annotation ' + (m.style || "") + '">' + escapeHtml(m.text) + '</div>';
        return;
      }
      html += '<div class="msg-bubble ' + (m.role === "user" ? "user" : "bot") + '">' + escapeHtml(m.content) + '</div>';
    });
    if (sending) {
      html += '<div class="msg-bubble bot typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    }
    thread.innerHTML = html;
    if (paused) {
      var banner = document.createElement("div");
      banner.className = "paused-banner";
      banner.textContent = "This conversation has been handed to staff — the real bot would stop replying here.";
      main.appendChild(banner);
    }
    scrollToBottom();
  }

  function addAnnotation(text, style) {
    messages.push({ kind: "annotation", text: text, style: style || "" });
  }

  async function sendMessage(text) {
    if (!text.trim() || sending || paused) return;
    messages.push({ role: "user", content: text.trim() });
    sending = true;
    input.value = "";
    autoResize();
    render();

    try {
      var res = await fetch(BOT_TEST_URL + "?token=" + encodeURIComponent(BOT_TEST_TOKEN), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: messages.filter(function (m) { return !m.kind; }).map(function (m) { return { role: m.role, content: m.content }; }),
        }),
      });
      var data = await res.json().catch(function () { return null; });

      if (!res.ok || !data || data.error) {
        addAnnotation((data && data.error) || "Something went wrong talking to the bot.", "escalated");
      } else {
        messages.push({ role: "assistant", content: data.reply });
        if (data.appointment) {
          var p = data.appointment;
          addAnnotation(
            "🔧 would call send_appointment_link — patient_type: " + p.patient_type +
            (p.name ? ", name: " + p.name : "") + (p.dob ? ", dob: " + p.dob : "") +
            " → link to /" + p.path + "/ (not actually sent)",
            "tool"
          );
        }
        if (data.escalated) {
          addAnnotation("🚩 would call escalate_to_human — reason: " + (data.escalationReason || "unspecified"), "escalated");
          paused = true;
        }
      }
    } catch (err) {
      addAnnotation("Network error reaching the bot-test function.", "escalated");
    }

    sending = false;
    render();
  }

  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(120, input.scrollHeight) + "px";
  }

  sendBtn.addEventListener("click", function () { sendMessage(input.value); });
  input.addEventListener("input", autoResize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
  });
  quickRow.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-msg]");
    if (!btn) return;
    sendMessage(btn.getAttribute("data-msg"));
  });
  document.getElementById("reset-btn").addEventListener("click", function () {
    messages = []; paused = false; sending = false; render();
  });

  render();

  // ---------------- auth gate ----------------

  var loginScreen = document.getElementById("login-screen");
  var shell = document.getElementById("shell");

  function showApp() { loginScreen.style.display = "none"; shell.style.display = "flex"; }
  function showLogin(message) {
    shell.style.display = "none";
    loginScreen.style.display = "flex";
    var err = document.getElementById("login-error");
    if (message) { err.textContent = message; err.classList.add("show"); } else { err.classList.remove("show"); }
  }

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var password = document.getElementById("login-password").value;
    if (password !== SITE_PASSWORD) { showLogin("Wrong password"); return; }
    try { localStorage.setItem(AUTH_STORAGE_KEY, "1"); } catch (err) {}
    showApp();
  });

  var alreadyAuthed = false;
  try { alreadyAuthed = localStorage.getItem(AUTH_STORAGE_KEY) === "1"; } catch (err) {}
  if (alreadyAuthed) showApp(); else showLogin();
})();
</script>
</body>
</html>
