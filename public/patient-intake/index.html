<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #F4F7F5; --surface: #FFFFFF; --surface-2: #EAF0EC;
    --ink: #16211C; --ink-muted: #5B6961; --line: #DAE3DD;
    --accent: #0E7C74; --accent-ink: #FFFFFF; --accent-soft: #E1F2EF;
    --good: #2E7D4F; --good-soft: #E4F4E9; --warn: #966008; --warn-soft: #FBF0DD;
    --critical: #B23A2B; --critical-soft: #FBE6E3;
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 4px 16px rgba(20, 30, 25, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0F1613; --surface: #172420; --surface-2: #1E2C27; --ink: #E9F2EC;
      --ink-muted: #93A69C; --line: #2B3C35; --accent: #45C3B5; --accent-ink: #06201D;
      --accent-soft: #16332E; --good: #63CC88; --good-soft: #163825; --warn: #E7AC46;
      --warn-soft: #3A2D14; --critical: #F1786C; --critical-soft: #3B1D18;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0F1613; --surface: #172420; --surface-2: #1E2C27; --ink: #E9F2EC;
    --ink-muted: #93A69C; --line: #2B3C35; --accent: #45C3B5; --accent-ink: #06201D;
    --accent-soft: #16332E; --good: #63CC88; --good-soft: #163825; --warn: #E7AC46;
    --warn-soft: #3A2D14; --critical: #F1786C; --critical-soft: #3B1D18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 20px 14px 60px;
  }
  .card { max-width: 560px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px 26px; box-shadow: var(--shadow); }
  .step { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin: 0 0 6px; }
  h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitle { color: var(--ink-muted); font-size: 0.85rem; margin: 0 0 22px; line-height: 1.4; }
  fieldset { border: none; padding: 0; margin: 0 0 20px; }
  legend { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); margin-bottom: 10px; padding: 0; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
  label .req { color: var(--critical); margin-left: 2px; }
  input[type="text"], input[type="tel"], input[type="email"], input[type="number"], input[type="date"], select, textarea {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px;
    font-size: 0.92rem; font-family: inherit; background: var(--surface); color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; font-weight: 400; }
  .other-input { margin-top: 8px; display: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--accent);
    color: var(--accent-ink); font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  button:disabled { background: var(--ink-muted); cursor: not-allowed; }
  .status { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; display: none; }
  .status.error { display: block; background: var(--critical-soft); color: var(--critical); }
  .status.success { display: block; background: var(--good-soft); color: var(--good); }
</style>
</head>
<body>

<div class="card">
  <p class="step">Step 1 of 2</p>
  <h1>Patient Intake</h1>
  <p class="subtitle">A few details to register you as a patient. Next you'll pick a preferred appointment time.</p>

  <form id="intake-form" novalidate>
    <fieldset>
      <legend>Patient details</legend>

      <div class="field">
        <label for="name_prefix">Title<span class="req">*</span></label>
        <select id="name_prefix" required>
          <option value="" disabled selected>Select</option>
          <option>Mr</option><option>Mrs</option><option>Ms</option><option>Dr</option>
          <option>Master</option><option>Baby</option><option value="__other__">Other</option>
        </select>
        <input type="text" class="other-input" id="name_prefix_other" placeholder="Please specify">
      </div>

      <div class="field">
        <label for="patient_name">Full name<span class="req">*</span></label>
        <input type="text" id="patient_name" required>
      </div>

      <div class="row2">
        <div class="field">
          <label for="date_of_birth">Date of birth<span class="req">*</span></label>
          <input type="date" id="date_of_birth" required>
        </div>
        <div class="field">
          <label for="age">Age</label>
          <input type="text" id="age" inputmode="numeric" placeholder="Optional">
        </div>
      </div>

      <div class="field">
        <label for="gender">Gender<span class="req">*</span></label>
        <select id="gender" required>
          <option value="" disabled selected>Select</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>Contact</legend>
      <div class="field">
        <label for="mobile_number">Mobile number<span class="req">*</span></label>
        <input type="tel" id="mobile_number" required>
        <div class="checkbox-row" style="margin-top:8px;">
          <input type="checkbox" id="no_phone_number">
          <label for="no_phone_number">Patient has no phone number</label>
        </div>
      </div>
      <div class="field"><label for="alternate_number">Alternate number</label><input type="tel" id="alternate_number"></div>
      <div class="field"><label for="contact_emailid">Email</label><input type="email" id="contact_emailid"></div>
    </fieldset>

    <fieldset>
      <legend>Address</legend>
      <div class="field"><label for="flat_house_building">Flat / house / building</label><input type="text" id="flat_house_building"></div>
      <div class="field"><label for="colony_street_locality">Colony / street / locality</label><input type="text" id="colony_street_locality"></div>
      <div class="field"><label for="pincode">Pincode</label><input type="text" id="pincode" inputmode="numeric"></div>
    </fieldset>

    <fieldset>
      <legend>Referral & ID</legend>
      <div class="field"><label for="referred_by">Referred by</label><input type="text" id="referred_by"></div>
      <div class="field">
        <label for="id_proof">ID proof<span class="req">*</span></label>
        <select id="id_proof" required>
          <option value="" disabled selected>Select</option>
          <option>Aadhaar</option><option>PAN</option><option>Passport</option>
          <option>Voter ID</option><option>Driving License</option><option value="__other__">Other</option>
        </select>
        <input type="text" class="other-input" id="id_proof_other" placeholder="Please specify">
      </div>
      <div class="field"><label for="id_number">ID number<span class="req">*</span></label><input type="text" id="id_number" required></div>
    </fieldset>

    <fieldset>
      <legend>Emergency contact</legend>
      <div class="field"><label for="emergency_name">Name</label><input type="text" id="emergency_name"></div>
      <div class="field"><label for="emergency_relationship">Relationship</label><input type="text" id="emergency_relationship"></div>
      <div class="field"><label for="emergency_contactnumber">Contact number</label><input type="tel" id="emergency_contactnumber"></div>
      <div class="field"><label for="emergency_emailid">Email</label><input type="email" id="emergency_emailid"></div>
    </fieldset>

    <button type="submit" id="submit-btn">Continue to appointment time</button>
    <div class="status" id="status"></div>
  </form>
</div>

<script>
(function () {
  // Same project/key as the rest of the site's forms.
  var SUPABASE_URL = "https://vppwvpplehaxiqzoibkj.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwcHd2cHBsZWhheGlxem9pYmtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMzI1NzIsImV4cCI6MjA5ODgwODU3Mn0.XN9GceqLqxScG8shwxK_iu4iC4bMXiGg6pVMuuAuKxA";

  var params = new URLSearchParams(window.location.search);
  var ref = params.get("ref") || "";

  var form = document.getElementById("intake-form");
  var statusEl = document.getElementById("status");
  var submitBtn = document.getElementById("submit-btn");

  document.querySelectorAll("select").forEach(function (select) {
    var otherInput = document.getElementById(select.id + "_other");
    if (!otherInput) return;
    select.addEventListener("change", function () {
      otherInput.style.display = select.value === "__other__" ? "block" : "none";
      if (select.value === "__other__") otherInput.focus();
    });
  });

  function selectValue(id) {
    var select = document.getElementById(id);
    if (select.value === "__other__") return document.getElementById(id + "_other").value.trim() || null;
    return select.value || null;
  }
  function textValue(id) {
    var v = document.getElementById(id).value.trim();
    return v === "" ? null : v;
  }
  function setStatus(kind, message) {
    statusEl.className = "status " + kind;
    statusEl.textContent = message;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!form.reportValidity()) return;

    var name = textValue("patient_name");
    var dob = textValue("date_of_birth");

    var row = {
      name_prefix: selectValue("name_prefix"),
      patient_name: name,
      date_of_birth: dob,
      gender: selectValue("gender"),
      age: textValue("age"),
      mobile_number: textValue("mobile_number"),
      no_phone_number: document.getElementById("no_phone_number").checked,
      alternate_number: textValue("alternate_number"),
      contact_emailid: textValue("contact_emailid"),
      flat_house_building: textValue("flat_house_building"),
      colony_street_locality: textValue("colony_street_locality"),
      pincode: textValue("pincode"),
      referred_by: textValue("referred_by"),
      id_proof: selectValue("id_proof"),
      id_number: textValue("id_number"),
      emergency_name: textValue("emergency_name"),
      emergency_relationship: textValue("emergency_relationship"),
      emergency_contactnumber: textValue("emergency_contactnumber"),
      emergency_emailid: textValue("emergency_emailid"),
      source_row_ref: ref || ("web-form-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8)),
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";
    statusEl.className = "status";

    fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/patient_intake_queue", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY,
        "Prefer": "return=minimal",
      },
      body: JSON.stringify(row),
    })
      .then(function (response) {
        if (!response.ok) {
          return response.text().then(function (text) { throw new Error("HTTP " + response.status + ": " + text); });
        }
        setStatus("success", "Details saved — taking you to appointment scheduling…");
        var next = new URLSearchParams();
        if (ref) next.set("ref", ref);
        next.set("name", name);
        next.set("dob", dob);
        setTimeout(function () {
          window.location.href = "../appointment/?" + next.toString();
        }, 900);
      })
      .catch(function (err) {
        console.error("Patient intake submission failed:", err);
        setStatus("error", "Something went wrong submitting this form. Please try again, or let the front desk know.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue to appointment time";
      });
  });
})();
</script>
</body>
</html>
